function renderDuplicates(groups){
  hdr.textContent = groups.length+' duplicate cluster(s) — pick the one to keep';
  view.innerHTML = '<button class="btn sec" id="backmem" style="margin-bottom:14px">← back to memory</button>'+
    groups.map((g,gi)=>`<div class="mem" style="border-color:#3a3418">
      <div class="k" style="margin-bottom:8px">cluster ${gi+1} · ${g.length} similar · branch ${esc(g[0].branch)}</div>
      ${g.map(m=>`<div style="display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-top:1px solid #17171a">
        <button class="btn" data-keep="${esc(m.id)}" data-gi="${gi}" style="padding:4px 10px;font-size:11px">Keep this</button>
        <div><span class="badge k-${esc(m.kind)}">${esc(m.kind)}</span>
          <span class="k">[${esc(m.id)}]</span><div class="t" style="margin-top:3px">${esc(m.text)}</div></div>
      </div>`).join('')}</div>`).join('');
  document.getElementById('backmem').onclick=()=>render('memory');
  view.querySelectorAll('[data-keep]').forEach(el=>el.onclick=async()=>{
    const gi=+el.dataset.gi, keep=el.dataset.keep;
    const drop=groups[gi].map(m=>m.id).filter(id=>id!==keep);
    if(!confirm(`Keep [${keep}] and archive ${drop.length} duplicate(s)?`)) return;
    try{ await post('/api/memory/merge', {keep, drop}); render('memory'); }
    catch(e){ alert('Merge failed: '+e.message); }
  });
}

async function renderGraph(){
  if(!window.d3){ view.innerHTML='<span class="hint">graph needs d3 (blocked/offline CDN). Connect once to load '+
    '<code>cdn.jsdelivr.net/npm/d3</code>, or use Memory/Docs tabs offline.</span>'; return; }
  let g; try{ g = await api('/api/graph'); }
  catch(e){ view.innerHTML='<span class="hint">graph API failed: '+esc(e.message)+'</span>'; return; }

  const ids = new Set(g.nodes.map(n=>n.id));
  const nodes = g.nodes.map(d=>({...d}));
  // Drop links whose endpoints aren't in the node set — d3.forceLink THROWS on
  // a missing id and aborts the whole render (that was the "blank graph" bug).
  const links = g.edges.filter(e=>ids.has(e.from)&&ids.has(e.to))
                       .map(e=>({source:e.from,target:e.to,rel:e.rel}));
  hdr.textContent = nodes.length + ' nodes · ' + links.length + ' links · scroll to zoom, drag nodes, hover to focus';
  if(!nodes.length){ view.innerHTML='<span class="hint">graph is empty — run <code>omni-memory build</code> or <code>omni-memory check --graph</code>.</span>'; return; }
  view.innerHTML = '<svg id="g"></svg>';

  const svg = d3.select('#g'), gg = svg.append('g');
  const W = svg.node().clientWidth || window.innerWidth, H = svg.node().clientHeight || window.innerHeight;
  svg.call(d3.zoom().scaleExtent([.08,4]).on('zoom',e=>gg.attr('transform',e.transform)));
  const col = {branch:isDark()?'#e8bd57':'#8a5412', memory:'#9c7b3f', file:'#b59a6a'};

  // node size by connectivity so hubs read as hubs
  const deg = {}; links.forEach(l=>{deg[l.source]=(deg[l.source]||0)+1; deg[l.target]=(deg[l.target]||0)+1;});
  const rOf = d => d.kind==='branch' ? 12 : d.kind==='file' ? 5 : 6+Math.min(7,(deg[d.id]||0));
  const short = s => { s=''+s; return s.length>28 ? s.slice(0,27)+'…' : s; };

  // SPACIOUS layout: strong repulsion + long links + a big collision bubble so
  // interconnected nodes get real breathing room instead of clumping.
  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d=>d.id)
                     .distance(l=>l.rel==='remembers'?90:150).strength(.2))
    .force('charge', d3.forceManyBody().strength(-900).distanceMax(1200))
    .force('collide', d3.forceCollide().radius(d=>rOf(d)+62).iterations(2))
    .force('x', d3.forceX(W/2).strength(.03))
    .force('y', d3.forceY(H/2).strength(.03));

  const link = gg.append('g').attr('stroke',TC().link).attr('stroke-width',.9)
    .selectAll('line').data(links).join('line');
  const node = gg.append('g').selectAll('g').data(nodes).join('g').style('cursor','pointer')
    .call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;})
      .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));
  node.append('circle').attr('r',rOf).attr('fill',d=>col[d.kind]||'#889')
    .attr('stroke',TC().stroke).attr('stroke-width',1.5);
  node.append('title').text(d=>d.label);                 // full text on hover
  node.append('text').attr('x',d=>rOf(d)+5).attr('y',3).text(d=>short(d.label))
    .attr('fill',d=>d.kind==='branch'?(isDark()?'#dcdce0':'#1b2330'):TC().text).style('pointer-events','none');

  // hover: spotlight a node + its direct neighbours, fade the rest
  const adj = {}; links.forEach(l=>{const a=l.source.id||l.source,b=l.target.id||l.target;
    (adj[a]=adj[a]||new Set()).add(b); (adj[b]=adj[b]||new Set()).add(a);});
  node.on('mouseenter',(e,d)=>{ const keep=new Set(adj[d.id]||[]); keep.add(d.id);
      node.style('opacity',n=>keep.has(n.id)?1:.12);
      link.style('stroke-opacity',l=>(l.source.id===d.id||l.target.id===d.id)?.95:.04); })
    .on('mouseleave',()=>{ node.style('opacity',1); link.style('stroke-opacity',1); });
  // click a memory node → open the editable inspector
  let memIndex=null;
  node.on('click', async (e,d)=>{
    if(!(d.id&&d.id.startsWith('mem:'))) return;
    if(!memIndex){ memIndex={}; (await api('/api/memories')).forEach(m=>memIndex[m.id]=m); }
    const m = memIndex[d.id.slice(4)]; if(m) openMemoryInspector(m);
  });

  sim.on('tick',()=>{ link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
      .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    node.attr('transform',d=>`translate(${d.x},${d.y})`); });

  // once it settles, zoom-to-fit so the (now spread-out) graph is fully visible
  sim.on('end',()=>{
    const xs=nodes.map(n=>n.x), ys=nodes.map(n=>n.y);
    const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
    const gw=(x1-x0)||1, gh=(y1-y0)||1, pad=240;   // room for labels extending right
    const k=Math.min(3,Math.max(.1,Math.min((W-pad)/gw,(H-pad)/gh)));
    const tx=W/2-k*(x0+x1)/2, ty=H/2-k*(y0+y1)/2;
    svg.transition().duration(500).call(d3.zoom().on('zoom',ev=>gg.attr('transform',ev.transform)).transform,
      d3.zoomIdentity.translate(tx,ty).scale(k));
  });
}

async function renderBranches(){
  let d = await api('/api/branches');
  let branches = d.branches || [];
  if(!branches.length){                       // cache empty → force a git sync once
    view.innerHTML = '<span class="hint">syncing git topology…</span>';
    d = await api('/api/branches?sync=1'); branches = d.branches || [];
  }
  if(!branches.length){ view.innerHTML='<span class="hint">no branches recorded yet — run <code>omni-memory branches</code> or work in a git repo.</span>'; return; }

  const def = d.default;
  const counts = {active:0, dormant:0, merged:0, abandoned:0};
  branches.forEach(b=> counts[b.status]=(counts[b.status]||0)+1);
  // by default show only what's live: current + active + the default spine.
  // merged / dormant / abandoned branches (usually the bulk on a team repo) are
  // hidden behind a toggle so the graph is readable.
  const isLive = b => b.name===def || b.name===d.current || b.status==='active';
  const hidden = branches.filter(b=>!isLive(b)).length;

  const draw = (showAll) => {
    const shown = showAll ? branches : branches.filter(isLive);
    const parts = [
      `by status: ${counts.active||0} active · ${counts.dormant||0} dormant · `+
      `${counts.merged||0} merged${counts.abandoned?' · '+counts.abandoned+' abandoned':''}`];
    hdr.innerHTML = `branch: <b>${esc(d.current)}</b> · default: ${esc(def)} · ${parts[0]}`+
      (hidden ? `  ·  <a id="brtoggle" style="cursor:pointer;color:var(--accent-2)">`+
        (showAll?`show active only`:`show all (${branches.length})`)+`</a>` : '');

    // ── git-DAG lane diagram: default branch is the spine, others diverge ──
    const rowH = 54, x0 = 40, laneW = 26;
    const ordered = [...shown].sort((a,b)=> (a.name===def?-1:b.name===def?1:(a.created_at||0)-(b.created_at||0)));
    const yOf = {}; ordered.forEach((b,i)=>yOf[b.name]=30+i*rowH);
    const H = 30 + ordered.length*rowH + 20, Wsvg = 900;
    const tc=TC();
    const col = {merged:'#b59a6a', dormant:'#a3907a', abandoned:'#c1522f', active:isDark()?'#e8bd57':'#8a5412'};
    const P=[];
    P.push(`<line x1="${x0}" y1="${yOf[def]||30}" x2="${x0}" y2="${H-20}" stroke="${tc.linkStrong}" stroke-width="2"/>`);
    ordered.forEach(b=>{
      const y=yOf[b.name], lane = b.name===def?0:1, cx=x0+lane*laneW;
      const baseY = (b.base_branch && yOf[b.base_branch]!=null)?yOf[b.base_branch]:yOf[def];
      if(b.name!==def){
        P.push(`<path d="M ${x0} ${baseY} C ${x0+laneW} ${baseY}, ${cx} ${y-20}, ${cx} ${y}" fill="none" stroke="${tc.link}" stroke-width="1.6"/>`);
        if(b.status==='merged'){ const my=yOf[b.into_branch]!=null?yOf[b.into_branch]:yOf[def];
          P.push(`<path d="M ${cx} ${y} C ${cx} ${y+18}, ${x0+laneW} ${my}, ${x0} ${my}" fill="none" stroke="${tc.link}" stroke-width="1.4" stroke-dasharray="3 3"/>`); }
      }
      const on = b.name===d.current;
      P.push(`<circle cx="${cx}" cy="${y}" r="${on?7:5.5}" fill="${on?tc.sel:(col[b.status]||'#b59a6a')}" stroke="${tc.stroke}" stroke-width="2"/>`);
      const meta=[b.creator?('by '+esc(b.creator)):'', b.status, b.status==='merged'&&b.into_branch?('→ '+esc(b.into_branch)):'',
        (b.ahead||b.behind)?`(↑${b.ahead||0} ↓${b.behind||0})`:''].filter(Boolean).join('  ·  ');
      P.push(`<text x="${cx+16}" y="${y-2}" fill="${on?tc.sel:tc.text}" font-weight="600">${esc(b.name)}${on?'  ◀ HEAD':''}</text>`);
      P.push(`<text x="${cx+16}" y="${y+13}" fill="${tc.text}" font-size="10">${meta}</text>`);
    });
    view.innerHTML = `<svg viewBox="0 0 ${Wsvg} ${H}" style="height:${H}px;max-width:${Wsvg}px">${P.join('')}</svg>`;
    const t = document.getElementById('brtoggle');
    if(t) t.onclick = ()=>draw(!showAll);
  };
  draw(false);
}

// ── Code Graph: functions/classes as nodes, click → dossier inspector ──
const CODE_COL = {class:'#a86a3c', function:'#96852f', method:'#b07a2e', file:'#a3927a'};
async function renderCode(){
  if(!window.d3){ view.innerHTML='<span class="hint">code graph needs d3 (offline/blocked CDN).</span>'; return; }
  let g; try{ g = await api('/api/codegraph'); }
  catch(e){ view.innerHTML='<span class="hint">code graph API failed: '+esc(e.message)+'</span>'; return; }
  const syms = g.nodes.filter(n=>n.kind!=='file');           // symbols carry the signal
  hdr.textContent = syms.length+' symbols · '+g.edges.length+' edges · click a node for its dossier';
  if(!syms.length){ view.innerHTML='<span class="hint">no code graph yet.<br>• Build it: <code>omni-memory build</code> (or <code>omni-memory check --graph</code>).<br>• For <b>non-Python</b> repos (JS/TS/Go/…) the deep graph needs tree-sitter — check <code>omni-memory doctor</code>; if it says “tree-sitter: absent”, install on Python ≥3.10: <code>pip install -U omni-memory-agent</code>.</span>'; return; }
  view.innerHTML = '<svg id="cg"></svg>';
  const ids = new Set(g.nodes.map(n=>n.id));
  const nodes = g.nodes.map(d=>({...d}));
  const links = g.edges.filter(e=>ids.has(e.src)&&ids.has(e.dst))
                       .map(e=>({source:e.src,target:e.dst,rel:e.rel}));
  const svg = d3.select('#cg'), gg = svg.append('g');
  const W = svg.node().clientWidth||window.innerWidth, H = svg.node().clientHeight||window.innerHeight;
  svg.call(d3.zoom().scaleExtent([.08,4]).on('zoom',e=>gg.attr('transform',e.transform)));
  const deg={}; links.forEach(l=>{deg[l.source]=(deg[l.source]||0)+1;deg[l.target]=(deg[l.target]||0)+1;});
  const rOf = d => d.kind==='file'?4 : d.kind==='class'?9 : 5+Math.min(8,(deg[d.id]||0));
  const short = s => {s=(''+s).split('::').pop(); return s.length>24?s.slice(0,23)+'…':s;};
  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d=>d.id).distance(l=>l.rel==='contains'?42:120).strength(.3))
    .force('charge', d3.forceManyBody().strength(-560).distanceMax(1000))
    .force('collide', d3.forceCollide().radius(d=>rOf(d)+38).iterations(2))
    .force('x', d3.forceX(W/2).strength(.04)).force('y', d3.forceY(H/2).strength(.04));
  const linkStroke = {contains:TC().link, calls:TC().linkStrong, inherits:isDark()?'#6a4a2a':'#c99a5e'};
  const link = gg.append('g').selectAll('line').data(links).join('line')
    .attr('stroke',d=>linkStroke[d.rel]||TC().link).attr('stroke-width',d=>d.rel==='calls'?1.3:.9)
    .attr('stroke-dasharray',d=>d.rel==='inherits'?'3 3':null);
  const node = gg.append('g').selectAll('g').data(nodes).join('g').style('cursor','pointer')
    .call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;})
      .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));
  node.append('circle').attr('r',rOf).attr('fill',d=>CODE_COL[d.kind]||'#889')
    .attr('stroke',TC().stroke).attr('stroke-width',1.5);
  node.append('title').text(d=>(d.signature?d.name+d.signature:d.name)+'  ·  '+d.file);
  node.append('text').attr('x',d=>rOf(d)+5).attr('y',3).text(d=>short(d.name))
    .attr('fill',TC().text).style('pointer-events','none');
  // hover: spotlight a node + everything it connects to (calls/callers/contains),
  // fade the rest — same affordance as the Memory Graph, so you can read the
  // wiring at a glance. Colour edges by relation so calls vs inheritance read.
  const adj={}; links.forEach(l=>{const a=l.source.id||l.source,b=l.target.id||l.target;
    (adj[a]=adj[a]||new Set()).add(b); (adj[b]=adj[b]||new Set()).add(a);});
  let selected=null;
  node.on('mouseenter',(e,d)=>{ const keep=new Set(adj[d.id]||[]); keep.add(d.id);
      node.style('opacity',n=>keep.has(n.id)?1:.10);
      link.style('stroke-opacity',l=>((l.source.id||l.source)===d.id||(l.target.id||l.target)===d.id)?.95:.05)
          .attr('stroke-width',l=>((l.source.id||l.source)===d.id||(l.target.id||l.target)===d.id)?2:(l.rel==='calls'?1.3:.9)); })
    .on('mouseleave',()=>{ node.style('opacity',1);
      link.style('stroke-opacity',1).attr('stroke-width',l=>l.rel==='calls'?1.3:.9); });
  node.on('click',(e,d)=>{ selected=d.id; openInspector(d.id);
    node.select('circle').attr('stroke',n=>n.id===d.id?TC().sel:TC().stroke).attr('stroke-width',n=>n.id===d.id?2.5:1.5); });
  sim.on('tick',()=>{ link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
      .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    node.attr('transform',d=>`translate(${d.x},${d.y})`); });
  sim.on('end',()=>{ const xs=nodes.map(n=>n.x),ys=nodes.map(n=>n.y);
    const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
    const gw=(x1-x0)||1,gh=(y1-y0)||1,pad=260, k=Math.min(3,Math.max(.1,Math.min((W-pad)/gw,(H-pad)/gh)));
    svg.transition().duration(500).call(d3.zoom().on('zoom',ev=>gg.attr('transform',ev.transform)).transform,
      d3.zoomIdentity.translate(W/2-k*(x0+x1)/2,H/2-k*(y0+y1)/2).scale(k)); });
}

// ── Conflicts: memories that contradict each other after a branch merge ──
async function renderConflicts(){
  let r; try{ r = await api('/api/conflicts'); }
  catch(e){ view.innerHTML='<span class="hint">conflicts API failed: '+esc(e.message)+'</span>'; return; }
  const conf = r.conflicts||[];
  hdr.textContent = conf.length ? conf.length+' open conflict(s) — pick a winner or keep both' : 'no open conflicts';
  if(!conf.length){ view.innerHTML='<span class="hint">No conflicts. When a merged branch\'s memory contradicts the base on the same symbol, it shows up here to resolve.</span>'; return; }
  const card = m => `<div style="flex:1;border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:var(--panel)">
      <div style="font-size:10px;color:var(--fg-3);font-family:var(--mono)">[${esc(m.id)}] · ${esc(m.branch)}${m.author?' · by '+esc(m.author):''}</div>
      <div style="margin-top:4px;color:var(--fg)">${esc(m.text)}</div>
      <button class="btn" data-keep="${esc(m.id)}" style="margin-top:8px;font-size:11px;padding:5px 12px">Keep this</button>
    </div>`;
  view.innerHTML = conf.map(c=>`<div class="mem" style="border-color:color-mix(in srgb,#c1522f 40%,var(--panel))">
      <div class="k" style="color:#c1522f">⚠ conflict on ${esc(c.anchor||'the same symbol')}</div>
      <div style="display:flex;gap:12px;margin-top:8px;flex-wrap:wrap">${card(c.a)}${card(c.b)}</div>
      <button class="btn sec" data-both="${esc(c.a.id)}" style="margin-top:10px;font-size:11px;padding:5px 12px">Keep both (they're both true)</button>
    </div>`).join('');
  const act = async (id, both) => { await fetch('/api/conflict/resolve',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({id,both})}); render('conflicts'); };
  view.querySelectorAll('[data-keep]').forEach(b=>b.onclick=()=>act(b.dataset.keep,false));
  view.querySelectorAll('[data-both]').forEach(b=>b.onclick=()=>act(b.dataset.both,true));
}

// ── Health Map: the codebase as memory-health "galaxies" ──
// Each file is a node clustered by module; colour is a single memory-health score
// on a warm→cool ramp (warm = under-remembered / stale, cool = fresh + trusted);
// files with no memory are hollow "dark" stars, so blind spots are visible.
// warm earth ramp: deep rust (under-remembered) → orange → amber → warm olive (healthy)
const HM_WARMCOOL = ['#a83a26','#cc6b2a','#dca63f','#8a8a30'];
function hmColor(s){ return d3.scaleLinear().domain([0,.4,.65,1]).range(HM_WARMCOOL).clamp(true)(s); }
const HM_VERDICT = {fresh:'#8a8a30', drifted:'#dca63f', orphaned:'#a83a26', blind:'#a3907a'};

async function renderHealth(){
  if(!window.d3){ view.innerHTML='<span class="hint">the Health Map needs d3 (offline/blocked CDN).</span>'; return; }
  let hm; try{ hm = await api('/api/healthmap'); }
  catch(e){ view.innerHTML='<span class="hint">health map API failed: '+esc(e.message)+'</span>'; return; }
  if(!hm.nodes.length){ view.innerHTML='<span class="hint">no code graph yet — build it: <code>omni-memory build</code> (or <code>map</code>).</span>'; return; }
  const st = hm.stats;
  hdr.textContent = `${st.files} files · ${st.remembered} remembered · ${st.blind} blind · ${st.drifted} drifted`
    + (st.orphaned?` · ${st.orphaned} orphaned`:'') + ` · avg health ${Math.round(st.avg_score*100)}%`;
  // memories per file, for the side panel (scoped to current branch)
  let mems=[]; try{ mems = await api('/api/memories'); }catch(_){ }
  const byFile={}; mems.forEach(m=>(m.files||[]).forEach(f=>(byFile[f]=byFile[f]||[]).push(m)));

  view.innerHTML = '<svg id="hm"></svg>'
    + '<div id="hmlegend" style="position:absolute;left:22px;bottom:18px;display:flex;align-items:center;gap:14px;'
    + 'font-size:11px;color:var(--fg-2);background:color-mix(in srgb,var(--panel) 88%,transparent);'
    + 'padding:7px 12px;border:1px solid var(--border);border-radius:9px;box-shadow:0 2px 8px var(--shadow)">'
    + '<span>under-remembered / stale</span>'
    + '<span style="width:150px;height:9px;border-radius:5px;display:inline-block;'
    + 'background:linear-gradient(90deg,'+HM_WARMCOOL.join(',')+')"></span>'
    + '<span>fresh &amp; trusted</span>'
    + '<span style="margin-left:8px;display:inline-flex;align-items:center;gap:5px">'
    + '<span style="width:9px;height:9px;border-radius:50%;border:1.5px solid var(--link-strong);display:inline-block"></span>no memory (blind)</span>'
    + '</div>';
  const svg=d3.select('#hm'), gg=svg.append('g');
  const W=svg.node().clientWidth||window.innerWidth, H=svg.node().clientHeight||window.innerHeight;
  svg.call(d3.zoom().scaleExtent([.05,5]).on('zoom',e=>gg.attr('transform',e.transform)));

  const nodes=hm.nodes.map(d=>({...d}));
  const idset=new Set(nodes.map(n=>n.id));
  const links=hm.edges.filter(e=>idset.has(e.src)&&idset.has(e.dst)).map(e=>({source:e.src,target:e.dst,w:e.w}));
  const rOf=d=>Math.min(22,3+Math.sqrt(d.size||1)*1.7);

  // cluster (galaxy) anchors on a grid — the force pulls each file toward its module
  const cl=hm.clusters, cols=Math.max(1,Math.ceil(Math.sqrt(cl.length))), rows=Math.ceil(cl.length/cols);
  const ax={},ay={}; cl.forEach((c,i)=>{ ax[c]=((i%cols)+.5)/cols*W; ay[c]=((Math.floor(i/cols))+.5)/rows*H; });
  const sim=d3.forceSimulation(nodes)
    .force('x',d3.forceX(d=>ax[d.cluster]).strength(.32))
    .force('y',d3.forceY(d=>ay[d.cluster]).strength(.32))
    .force('charge',d3.forceManyBody().strength(-7))
    .force('collide',d3.forceCollide(d=>rOf(d)+1.4).iterations(2));

  const link=gg.append('g').selectAll('line').data(links).join('line')
    .attr('stroke',TC().link).attr('stroke-opacity',.5).attr('stroke-width',d=>Math.min(2,.5+d.w*.25));
  const glab=gg.append('g').selectAll('text').data(cl).join('text')
    .attr('x',d=>ax[d]).attr('y',d=>ay[d]).text(d=>d).attr('text-anchor','middle')
    .attr('fill',TC().label).style('font-size','12px').style('letter-spacing','.08em')
    .style('pointer-events','none').style('text-transform','uppercase');
  const blindStroke=TC().linkStrong, ringStroke=isDark()?'rgba(0,0,0,.35)':'rgba(20,30,45,.22)';
  const node=gg.append('g').selectAll('circle').data(nodes).join('circle')
    .attr('r',rOf).style('cursor','pointer')
    .attr('fill',d=>d.score==null?TC().muted:hmColor(d.score))
    .attr('stroke',d=>d.protected?'#e6c34a':(d.score==null?blindStroke:ringStroke))
    .attr('stroke-width',d=>d.protected?2:1.2)
    .attr('opacity',d=>d.score==null?.55:.97);
  node.append('title').text(d=>d.id+(d.score==null?'  ·  no memory (blind spot)'
    :`  ·  health ${Math.round(d.score*100)}% · ${d.verdict} · ${d.mem} memor${d.mem===1?'y':'ies'}`
      +(d.stale?` · ${d.stale} stale`:'')));

  let sel=null;
  node.on('click',(e,d)=>{ sel=d.id; node.attr('stroke',n=>n.id===sel?TC().sel:(n.protected?'#e6c34a':(n.score==null?blindStroke:ringStroke)))
      .attr('stroke-width',n=>n.id===sel?2.6:(n.protected?2:1.2));
    openHealthPanel(d, byFile[d.id]||[]); });

  sim.on('tick',()=>{ link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    node.attr('cx',d=>d.x).attr('cy',d=>d.y); });
  sim.on('end',()=>{ const xs=nodes.map(n=>n.x),ys=nodes.map(n=>n.y);
    const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
    const gw=(x1-x0)||1,gh=(y1-y0)||1,pad=160,k=Math.min(2.5,Math.max(.08,Math.min((W-pad)/gw,(H-pad)/gh)));
    svg.transition().duration(600).call(d3.zoom().on('zoom',ev=>gg.attr('transform',ev.transform)).transform,
      d3.zoomIdentity.translate(W/2-k*(x0+x1)/2,H/2-k*(y0+y1)/2).scale(k)); });
}

function openHealthPanel(d, list){
  insp.classList.add('open');
  const vc = HM_VERDICT[d.verdict]||'#8a8b92';
  const pct = d.score==null?'—':Math.round(d.score*100)+'%';
  const evMark = m => m.evidence==='verified'?' ✓':m.evidence==='inferred'?' ~':'';
  const rows = (list||[]).slice(0,40).map(m=>
    `<div style="padding:8px 0;border-top:1px solid var(--border)">
       <span class="chip" data-goto-mem="${esc(m.id)}" style="cursor:pointer">${esc(m.id)}</span>
       <span style="color:var(--fg-2)">${esc(m.kind)}${evMark(m)}${m.stale?' ⚠STALE':''}${m.protected?' 🔒':''}</span>
       <div style="margin-top:4px;color:var(--fg)">${esc(m.text)}</div>
       ${m.author?`<div style="margin-top:3px;color:var(--fg-3);font-size:11px">by ${esc(m.author)}</div>`:''}
     </div>`).join('') || '<div style="padding:10px 0;color:var(--fg-2)">no memory anchored to this file — a blind spot.</div>';
  insp.innerHTML = `<div class="ibody">
    <div class="iclose" style="cursor:pointer;float:right;color:var(--fg-2);font-size:18px">×</div>
    <div style="font-size:11px;letter-spacing:.09em;color:var(--fg-2)">FILE MEMORY</div>
    <h3 style="margin:6px 0 4px;font-size:14px;color:var(--fg);word-break:break-all">${esc(d.id)}</h3>
    <div style="display:flex;align-items:center;gap:10px;margin:8px 0 4px">
      <span style="width:12px;height:12px;border-radius:50%;background:${d.score==null?'var(--node-muted)':hmColor(d.score)};border:1px solid ${vc}"></span>
      <b style="color:${vc}">${d.verdict}</b>
      <span style="color:var(--fg-2)">health ${pct} · ${d.mem} memor${d.mem===1?'y':'ies'}${d.stale?` · ${d.stale} stale`:''}${d.verified?` · ${d.verified} verified`:''}</span>
    </div>
    ${rows}
  </div>`;
  insp.querySelector('.iclose').onclick = closeInspector;
  insp.querySelectorAll('[data-goto-mem]').forEach(el=>el.onclick=()=>{
    activeTab='memory'; document.querySelectorAll('nav a').forEach(x=>x.classList.remove('on'));
    document.querySelector('nav a[data-tab="memory"]').classList.add('on'); render('memory'); });
}

// Everything between the SM-JS sentinels is lifted verbatim into the standalone artifact
// by `omni-memory systemmap` (which supplies its own api/isDark/esc/view/insp shims), so
// the dashboard and the shareable file render from ONE copy of this code. Keep the
// sentinels on their own lines — the extractor slices between them.
// SM-JS:START
// ══════════════════ System Map — the implemented architecture, with its decay ══════
// Hand-rolled isometric SVG: no d3, no CDN. The map therefore works offline and the
// standalone artifact is genuinely self-contained (their spec forbids a dependency for
// the isometric effect, which happens to match our zero-dependency design rule).
//
// What no generated architecture diagram can do: every building carries a verdict
// re-resolved from the git blob sha its memory was captured against, so a source that
// moved renders as visibly degraded instead of quietly staying confident.
const SM_NS = 'http://www.w3.org/2000/svg';
function sEl(tag, attrs, text){
  const e = document.createElementNS(SM_NS, tag);
  for(const k in attrs) if(attrs[k]!=null) e.setAttribute(k, attrs[k]);
  if(text!=null) e.textContent = text;   // never innerHTML — memory text is teammate-controlled
  return e;
}
function shade(hex, f){
  const n = parseInt(hex.slice(1),16);
  const c = [n>>16&255, n>>8&255, n&255].map(v=>Math.max(0,Math.min(255,Math.round(v*f))));
  return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
}
function SMC(){ return isDark()
  ? {FRESH:'#6fae7c', DRIFTED:'#d9a441', ORPHANED:'#cf6a55', UNVERIFIABLE:'#8a7551',
     BLIND:'#4d3e22', ground:'#2f2615', text:'#eaddc2', dim:'#8a7551'}
  : {FRESH:'#4f8f60', DRIFTED:'#c1841f', ORPHANED:'#b1503c', UNVERIFIABLE:'#a48c66',
     BLIND:'#d6c29c', ground:'#eddfc7', text:'#3a2c18', dim:'#a48c66'}; }
const SM_EDGE = {control:{c:'#8a5412', dash:'',    verb:'control'},
                 data:   {c:'#2f7f9f', dash:'7 5', verb:'data'},
                 event:  {c:'#8a5bb0', dash:'2 4', verb:'event'}};
const SM_VERDICT_HELP = {
  FRESH:'the cited bytes still hash to what the memory was derived from',
  DRIFTED:'the source changed after capture — re-derive the claim',
  ORPHANED:'the source is gone — drop the memory or re-source it',
  UNVERIFIABLE:'legacy memory with no content key — counted, never claimed fresh',
  BLIND:'no memory anchored here — an un-mapped region of the system'};
// zone bands, front (entry) to back (state)
const SM_ZONES = ['entry','application','async','state'];
const TW = 120, TH = 60;                        // 2:1 isometric tile

let SM = null;                                   // live map state for the tab

async function renderSystem(){
  let m;
  try { m = await api('/api/systemmap'); }
  catch(e){ view.innerHTML='<span class="hint">system map API failed: '+esc(e.message)+'</span>'; return; }
  if(!m.nodes.length){
    view.innerHTML='<span class="hint">nothing to map yet — build the code graph with '
      +'<code>omni-memory check --graph</code>, then capture or <code>omni-memory build</code> memory.</span>';
    return; }
  const r = m.repository, st = m.stats;
  hdr.textContent = `${st.buildings} buildings · ${st.routes} routes · ${st.flows} flows · `
    + `${st.memories} memories` + (st.notBindable?` · ${st.notBindable} not bindable`:'')
    + ` · branch ${r.branch} @ ${r.commitShort||'—'}`;

  // ── layout: each zone is an isometric platform; zones stack front-to-back ──
  //
  // On an isometric grid, stepping (+1,-1) moves level across the screen and (+1,+1)
  // moves straight down it. Laying a band out along the first axis and stacking bands
  // along the second collapses to plain screen coordinates — and, crucially, keeps the
  // grid unsheared, so a zone's floor is a true rhombus that sits under its buildings
  // instead of the leaning parallelogram a per-row offset produces.
  const CSTEP = 1.25, SUBROW = 1.0, ZSTEP = 2.35, PER_ROW = 4;
  const byZone = {}; SM_ZONES.forEach(z=>byZone[z]=[]);
  m.nodes.forEach(n=>(byZone[n.zone]||byZone.application).push(n));
  const placed = [], bands = [];
  let B = 0;
  SM_ZONES.forEach(z=>{
    const list = byZone[z]; if(!list.length) return;
    const rows = Math.ceil(list.length/PER_ROW);
    const widest = Math.min(list.length, PER_ROW);
    list.forEach((n,i)=>{
      const rIdx = Math.floor(i/PER_ROW), inRow = i%PER_ROW;
      const count = Math.min(PER_ROW, list.length - rIdx*PER_ROW);
      const t = (inRow-(count-1)/2)*CSTEP;          // level across the band
      placed.push({...n, zone:z, x:t*TW, y:(B + rIdx*SUBROW)*TH});
    });
    bands.push({zone:z, cx:0, cy:(B + (rows-1)*SUBROW/2)*TH,
                halfW:((widest-1)/2*CSTEP + 0.8)*TW,
                halfH:((rows-1)*SUBROW/2 + 0.8)*TH});
    B += (rows-1)*SUBROW + ZSTEP;
  });
  // a real isometric floor tile: a rhombus, 2:1, centred on its band
  const bandPts = b => [[b.cx+b.halfW,b.cy],[b.cx,b.cy+b.halfH],
                        [b.cx-b.halfW,b.cy],[b.cx,b.cy-b.halfH]];
  const pos = {}; placed.forEach(n=>{ pos[n.id]={x:n.x, y:n.y, n}; });
  const hs = placed.map(n=>n.height||1), hmax = Math.max(...hs,1);
  const hOf = n => 22 + Math.sqrt((n.height||1)/hmax)*58;

  view.innerHTML = '';
  // ── snapshot + flow picker ──
  const top = document.createElement('div'); top.className='smbar';
  const snap = document.createElement('span'); snap.className='smsnap';
  snap.textContent = (r.url? r.url.replace(/^https:\/\/(www\.)?/,'') : 'local repo')
    + ` · ${r.branch}` + (r.base?` (base ${r.base})`:'') + ` · ${r.commitShort||'no commit'}`;
  top.appendChild(snap);
  const fsel = document.createElement('select'); fsel.className='smsel';
  fsel.setAttribute('aria-label','Choose an end-to-end flow to step through');
  fsel.appendChild(new Option('— no flow selected —',''));
  m.flows.forEach(f=>fsel.appendChild(new Option(f.label + (f.verdict!=='FRESH'?`  (${f.verdict})`:''), f.id)));
  if(m.flows.length) top.appendChild(fsel);
  const mkBtn = (label,title)=>{ const b=document.createElement('button');
    b.className='smbtn'; b.textContent=label; b.title=title; b.type='button'; return b; };
  const prev = mkBtn('‹ Prev','Previous step in the selected flow');
  const next = mkBtn('Next ›','Next step in the selected flow');
  prev.disabled = next.disabled = true;
  if(m.flows.length){ top.appendChild(prev); top.appendChild(next); }
  const spacer = document.createElement('span'); spacer.style.flex='1'; top.appendChild(spacer);
  const zin=mkBtn('+','Zoom in'), zout=mkBtn('−','Zoom out'), zres=mkBtn('Reset','Reset the view');
  [zin,zout,zres].forEach(b=>top.appendChild(b));
  view.appendChild(top);

  // ── legend: relationship kinds are toggles, verdicts are the decay key ──
  const leg = document.createElement('div'); leg.className='smlegend';
  const hidden = new Set();
  Object.keys(SM_EDGE).forEach(k=>{
    const b=document.createElement('button'); b.type='button'; b.className='smtog';
    b.setAttribute('aria-pressed','true'); b.title='Show or hide '+k+' routes';
    const sw=document.createElement('span'); sw.className='smsw';
    sw.style.borderTopStyle = k==='control'?'solid':'dashed';
    sw.style.borderTopColor = SM_EDGE[k].c;
    b.appendChild(sw); b.appendChild(document.createTextNode(k));
    b.onclick = ()=>{ hidden.has(k)?hidden.delete(k):hidden.add(k);
      b.setAttribute('aria-pressed', String(!hidden.has(k)));
      b.classList.toggle('off', hidden.has(k)); paint(); };
    leg.appendChild(b);
  });
  const sep=document.createElement('span'); sep.className='smsep'; leg.appendChild(sep);
  Object.keys(SM_VERDICT_HELP).forEach(v=>{
    if(!(st.verdicts||{})[v] && v!=='FRESH') return;      // only show verdicts present
    const s=document.createElement('span'); s.className='smkey'; s.title=SM_VERDICT_HELP[v];
    const d=document.createElement('span'); d.className='smdot'; d.style.background=SMC()[v];
    s.appendChild(d); s.appendChild(document.createTextNode(v.toLowerCase()));
    leg.appendChild(s);
  });
  view.appendChild(leg);

  const svg = sEl('svg',{id:'sm', role:'application', tabindex:'-1',
    'aria-label':'Isometric system map of this repository. Buildings are runtime roles; '
      +'routes are control, data and event paths. Select a building for its evidence.'});
  const gg = sEl('g',{});
  svg.appendChild(gg); view.appendChild(svg);
  const step = document.createElement('div'); step.className='smstep';
  step.setAttribute('aria-live','polite'); step.textContent =
    m.flows.length ? 'Pick a flow above to step through it.'
                   : 'No end-to-end flows recorded yet — capture a flow or endpoint memory written as A → B → C.';
  view.appendChild(step);

  // ── pan / zoom ──
  let tx=0, ty=0, k=1;
  function apply(){ gg.setAttribute('transform',`translate(${tx},${ty}) scale(${k})`); }
  function fit(){
    // Bound the real drawn extent — platforms out to the sides, the tallest roof
    // above, labels below — otherwise the city sits off-centre in a field of nothing.
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    bands.forEach(b=>{ bandPts(b).forEach(([x,y])=>{
      x0=Math.min(x0,x); x1=Math.max(x1,x); y0=Math.min(y0,y); y1=Math.max(y1,y); }); });
    placed.forEach(n=>{ const p=pos[n.id];
      y0=Math.min(y0, p.y-hOf(n)*1.3-TH/2); y1=Math.max(y1, p.y+TH/2+26); });
    const W=svg.clientWidth||svg.getBoundingClientRect().width||960;
    const H=svg.clientHeight||svg.getBoundingClientRect().height||540;
    const pad=56, w=(x1-x0)||1, h=(y1-y0)||1;
    k=Math.max(.2,Math.min(1.5,Math.min((W-pad*2)/w,(H-pad*2)/h)));
    tx=W/2-k*(x0+x1)/2; ty=H/2-k*(y0+y1)/2; apply();
  }
  zin.onclick=()=>{k=Math.min(3,k*1.25);apply();};
  zout.onclick=()=>{k=Math.max(.15,k/1.25);apply();};
  zres.onclick=fit;
  svg.addEventListener('wheel',e=>{ e.preventDefault();
    k=Math.max(.15,Math.min(3,k*(e.deltaY<0?1.12:1/1.12))); apply(); },{passive:false});
  let drag=null;
  svg.addEventListener('pointerdown',e=>{ if(e.target.closest('[data-node]')) return;
    drag={x:e.clientX,y:e.clientY,tx,ty}; svg.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove',e=>{ if(!drag) return;
    tx=drag.tx+(e.clientX-drag.x); ty=drag.ty+(e.clientY-drag.y); apply(); });
  svg.addEventListener('pointerup',()=>{ drag=null; });

  // ── selection + flow state ──
  let sel=null, flow=null, fi=-1;
  fsel.onchange=()=>{ flow=m.flows.find(f=>f.id===fsel.value)||null; fi=flow?0:-1; syncFlow(); };
  prev.onclick=()=>{ if(flow&&fi>0){fi--;syncFlow();} };
  next.onclick=()=>{ if(flow&&fi<flow.steps.length-1){fi++;syncFlow();} };
  function syncFlow(){
    prev.disabled = !flow || fi<=0;
    next.disabled = !flow || fi>=flow.steps.length-1;
    if(!flow){ step.textContent='Pick a flow above to step through it.'; sel=null; paint(); return; }
    const s=flow.steps[fi];
    step.textContent = `Step ${fi+1} of ${flow.steps.length} — ${s.action}`
      + (s.citation? `   ·   ${s.citation.path}:${s.citation.startLine}-${s.citation.endLine}` : '   ·   no citation for this step');
    sel = s.nodeId || null; paint();
    if(sel && pos[sel]) openSystemPanel(pos[sel].n, m);
  }

  // ── paint ─────────────────────────────────────────────────────────────────
  function paint(){
    while(gg.firstChild) gg.removeChild(gg.firstChild);
    const C = SMC(), gnodes = {};
    const defs = sEl('defs',{});
    // hatch marks a DRIFTED building without hiding it — degraded, not deleted
    const pat = sEl('pattern',{id:'smhatch', width:'6', height:'6',
      patternUnits:'userSpaceOnUse', patternTransform:'rotate(45)'});
    pat.appendChild(sEl('rect',{width:'6',height:'6',fill:'none'}));
    pat.appendChild(sEl('line',{x1:'0',y1:'0',x2:'0',y2:'6',stroke:C.ORPHANED,
      'stroke-width':'1.6','stroke-opacity':'.55'}));
    defs.appendChild(pat);
    Object.keys(SM_EDGE).forEach(kd=>{                 // one arrowhead per route colour
      const mk = sEl('marker',{id:'smar-'+kd, viewBox:'0 0 10 10', refX:'9', refY:'5',
        markerWidth:'6', markerHeight:'6', orient:'auto-start-reverse'});
      mk.appendChild(sEl('path',{d:'M0,1 L10,5 L0,9 z', fill:SM_EDGE[kd].c}));
      defs.appendChild(mk);
    });
    gg.appendChild(defs);

    const adj = sel ? new Set(m.edges.filter(e=>e.from===sel||e.to===sel)
                              .flatMap(e=>[e.from,e.to])) : null;

    // ── ground: one platform per zone, so buildings stand on something and the
    // entry → application → async → state progression is actually visible ──
    bands.forEach(b=>{
      const pts = bandPts(b).map(p=>p.join(',')).join(' ');
      gg.appendChild(sEl('polygon',{points:pts, fill:C.ground, 'fill-opacity':'.55',
        stroke:C.dim, 'stroke-opacity':'.35', 'stroke-width':'1'}));
      // zone label sits OUTSIDE the platform's left vertex — inside, a building covers it
      gg.appendChild(sEl('text',{x:b.cx-b.halfW-14, y:b.cy+4, fill:C.dim, 'text-anchor':'end',
        style:'font-size:10px;letter-spacing:.16em;text-transform:uppercase;pointer-events:none'},
        b.zone));
    });

    // routes next (buildings occlude them), skipping hidden kinds
    m.edges.forEach(e=>{
      if(hidden.has(e.kind) || !pos[e.from] || !pos[e.to]) return;
      const a=pos[e.from], b=pos[e.to], sp=SM_EDGE[e.kind];
      const on = !sel || e.from===sel || e.to===sel;
      // stop short of the destination facade so the arrowhead lands in front of it
      const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1, back=Math.min(38,len*0.28);
      const ex=b.x-dx/len*back, ey=b.y-dy/len*back;
      const mx=(a.x+ex)/2, my=(a.y+ey)/2-30;      // lift the crossing so routes don't knot
      const d=`M${a.x},${a.y} Q${mx},${my} ${ex},${ey}`;
      const g = sEl('g',{'data-edge':e.id, style:'cursor:pointer',
        opacity: on?1:.18});
      // a pale casing under the line keeps it legible where it crosses a platform
      g.appendChild(sEl('path',{d, fill:'none', stroke:C.ground,
        'stroke-width': on?6:4, 'stroke-opacity':'.8', 'stroke-linecap':'round'}));
      g.appendChild(sEl('path',{d, fill:'none', stroke:sp.c, 'stroke-width': on?2.6:1.8,
        'stroke-dasharray':sp.dash||null, 'stroke-linecap':'round',
        'marker-end':'url(#smar-'+e.kind+')'}));
      g.appendChild(sEl('title',{}, `${e.from} —${e.verb}→ ${e.to}`));
      g.addEventListener('click',ev=>{ ev.stopPropagation(); sel=null; paint(); openEdgePanel(e); });
      gg.appendChild(g);
    });

    // buildings back-to-front so occlusion is predictable
    // back-to-front: a nearer building (larger y) must draw over a farther one
    placed.slice().sort((p,q)=>(p.y-q.y)||(p.x-q.x)).forEach(n=>{
      const {x,y}=pos[n.id];
      const vc = C[n.verdict]||C.dim;
      const orph = n.verdict==='ORPHANED';
      let h = hOf(n) * (orph?0.38:1) * (n.kind==='broker'?0.62:n.kind==='gateway'?1.28:1);
      const s = n.kind==='broker'?0.94:n.kind==='gateway'?0.56:n.kind==='store'?0.7:0.78;
      const hw=TW/2*s, hh=TH/2*s;
      // dim unrelated buildings, never hide them — the spec's rule, and a hidden
      // building would silently erase a part of the system from the reader's model
      const dim = adj && !adj.has(n.id) && n.id!==sel;
      const g = sEl('g',{'data-node':n.id, tabindex:'0', role:'button',
        'aria-label':`${n.label}, ${n.kind}, ${n.verdict}`,
        opacity: dim?0.48:1, style:'cursor:pointer'});

      g.appendChild(sEl('ellipse',{cx:x, cy:y+4, rx:hw*1.05, ry:hh*0.85,
        fill:C.ground, opacity:'.5'}));                       // contact shadow
      if(n.verdict==='BLIND'){                                 // wireframe: nothing known here
        g.appendChild(sEl('polygon',{points:`${x},${y-hh} ${x+hw},${y} ${x},${y+hh} ${x-hw},${y}`,
          fill:'none', stroke:vc, 'stroke-width':'1.4', 'stroke-dasharray':'5 4'}));
      } else {
        const t=y-h;
        // left + right faces, then the roof on top
        g.appendChild(sEl('polygon',{points:`${x-hw},${t} ${x},${t+hh} ${x},${y+hh} ${x-hw},${y}`,
          fill:shade(vc,.62), stroke:shade(vc,.45), 'stroke-width':'.8'}));
        g.appendChild(sEl('polygon',{points:`${x},${t+hh} ${x+hw},${t} ${x+hw},${y} ${x},${y+hh}`,
          fill:shade(vc,.82), stroke:shade(vc,.45), 'stroke-width':'.8'}));
        const roof = `${x},${t-hh} ${x+hw},${t} ${x},${t+hh} ${x-hw},${t}`;
        g.appendChild(sEl('polygon',{points:roof, fill:vc, stroke:shade(vc,.7), 'stroke-width':'.8'}));
        if(n.verdict==='DRIFTED')                              // degraded, still legible
          g.appendChild(sEl('polygon',{points:roof, fill:'url(#smhatch)', stroke:'none'}));
        if(n.verdict==='UNVERIFIABLE')
          g.appendChild(sEl('polygon',{points:roof, fill:'none', stroke:C.text,
            'stroke-width':'1.2','stroke-dasharray':'2 3','stroke-opacity':'.6'}));
        if(orph)                                               // a crack through the rubble
          g.appendChild(sEl('path',{d:`M${x-hw*.6},${t+hh*.2} L${x-hw*.1},${t-hh*.3} L${x+hw*.3},${t+hh*.4}`,
            fill:'none', stroke:shade(vc,.5), 'stroke-width':'1.8'}));
        if(n.kind==='broker')                                  // loading bays
          for(let i=1;i<4;i++) g.appendChild(sEl('line',{x1:x+hw*i/4, y1:t+hh*i/4+2,
            x2:x+hw*i/4, y2:y+hh*i/4-2, stroke:shade(vc,.55),'stroke-width':'1'}));
        if(n.kind==='store')                                   // vault: a banded cylinder
          g.appendChild(sEl('ellipse',{cx:x, cy:t, rx:hw*.62, ry:hh*.62,
            fill:'none', stroke:shade(vc,.6),'stroke-width':'1.2'}));
        if(n.kind==='gateway')                                 // the gate itself
          g.appendChild(sEl('rect',{x:x+hw*.2, y:y-h*.28, width:hw*.42, height:h*.24,
            fill:shade(vc,.42), stroke:'none'}));
      }
      if(n.id===sel) g.appendChild(sEl('polygon',{
        points:`${x},${y-hh-3} ${x+hw+3},${y} ${x},${y+hh+3} ${x-hw-3},${y}`,
        fill:'none', stroke:C.text, 'stroke-width':'2','stroke-dasharray':'4 3'}));
      // label on a pill, so a name never has to be read against a roof behind it
      const txt = n.label.length>20 ? n.label.slice(0,19)+'…' : n.label;
      const lw = txt.length*6.4+14;
      g.appendChild(sEl('rect',{x:x-lw/2, y:y+hh+3, width:lw, height:17, rx:8,
        fill:C.ground, 'fill-opacity':'.92', stroke:C.dim, 'stroke-opacity':'.35',
        style:'pointer-events:none'}));
      g.appendChild(sEl('text',{x, y:y+hh+15, 'text-anchor':'middle', fill:C.text,
        style:'font-size:11px;font-weight:600;pointer-events:none'}, txt));
      g.appendChild(sEl('title',{}, `${n.label} · ${n.kind} · ${n.verdict}\n`
        + SM_VERDICT_HELP[n.verdict] + `\n${n.memCount} memor${n.memCount===1?'y':'ies'}`));
      const pick = ()=>{ sel=n.id; paint(); openSystemPanel(n, m); };
      g.addEventListener('click',ev=>{ ev.stopPropagation(); pick(); });
      g.addEventListener('keydown',ev=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); pick(); } });
      // Hover emphasis adjusts opacity in place. Repainting here would destroy the very
      // element being hovered, so mouseleave would never fire and the map would stick.
      g.addEventListener('mouseenter',()=>{ if(!sel) emphasize(n.id); });
      g.addEventListener('mouseleave',()=>{ if(!sel) emphasize(null); });
      gnodes[n.id]=g; gg.appendChild(g);
    });

    function emphasize(id){
      const near = id ? new Set(m.edges.filter(e=>e.from===id||e.to===id)
                                .flatMap(e=>[e.from,e.to]).concat([id])) : null;
      for(const nid in gnodes)
        gnodes[nid].setAttribute('opacity', !near || near.has(nid) ? 1 : 0.3);
      gg.querySelectorAll('[data-edge]').forEach(el=>{
        const [f,t] = el.getAttribute('data-edge').split('->');
        el.setAttribute('opacity', !near || f===id || t===id ? 1 : 0.14);
      });
    }
  }
  SM = {paint, fit};
  paint();
  // fit AFTER layout — clientWidth/Height are 0 until the svg is measured, which is
  // what left the city sitting off-centre in a field of nothing.
  requestAnimationFrame(()=>{ fit(); requestAnimationFrame(fit); });
  addEventListener('resize', ()=>{ if(activeTab==='system') fit(); }, {once:false});
}

function openSystemPanel(n, m){
  insp.classList.add('open');
  const C = SMC(), vc = C[n.verdict]||C.dim;
  const ins = m.edges.filter(e=>e.to===n.id), outs = m.edges.filter(e=>e.from===n.id);
  const route = e => `<div class="smrow"><span class="chip" style="border-color:${SM_EDGE[e.kind].c}">${esc(e.kind)}</span>`
    + `${esc(e.from)} <b>${esc(e.verb)}</b> ${esc(e.to)}</div>`;
  const cites = (n.citations||[]).map(c=>{
    const label = `${c.path}:${c.startLine}-${c.endLine}`;
    const link = c.permalink ? `<a href="${esc(c.permalink)}" target="_blank" rel="noopener"
        style="color:var(--accent-2);text-decoration:none">${esc(label)} ↗</a>`
      : `<span style="font-family:var(--mono)">${esc(label)}</span>`;
    return `<div class="smrow">${link}<div class="hint" style="margin-top:2px">${esc(c.proves)}</div></div>`;
  }).join('') || '<div class="hint">No citations — nothing here rests on verifiable evidence yet.</div>';
  insp.innerHTML = `<div class="ipanel">
    <div class="ihead"><b>${esc(n.label)}</b><span class="iclose">✕</span></div>
    <div class="irow" style="gap:8px;flex-wrap:wrap">
      <span class="chip">${esc(n.kind)}</span><span class="chip">${esc(n.zone)}</span>
      <span class="chip" style="border-color:${vc};color:${vc}">${esc(n.verdict)}</span>
      <span class="chip">confidence: ${esc(n.confidence)}</span></div>
    <p style="color:var(--fg-2);margin:10px 0 4px">${esc(n.plainRole)}</p>
    <div class="sec">In this repository</div>
    <p style="color:var(--fg)">${esc(n.repoRole)}</p>
    <div class="sec">Provenance</div>
    <p class="hint">${esc(SM_VERDICT_HELP[n.verdict]||'')}</p>
    <div class="sec">What enters and leaves</div>
    ${ins.map(route).join('')||'<div class="hint">nothing recorded entering</div>'}
    ${outs.map(route).join('')||'<div class="hint">nothing recorded leaving</div>'}
    <div class="sec">Evidence</div>${cites}
  </div>`;
  insp.querySelector('.iclose').onclick = closeInspector;
}

function openEdgePanel(e){
  insp.classList.add('open');
  const sp = SM_EDGE[e.kind];
  insp.innerHTML = `<div class="ipanel">
    <div class="ihead"><b>${esc(e.from)} → ${esc(e.to)}</b><span class="iclose">✕</span></div>
    <div class="irow" style="gap:8px"><span class="chip" style="border-color:${sp.c}">${esc(e.kind)}</span>
      <span class="chip">${esc(e.verb)}</span><span class="chip">confidence: ${esc(e.confidence)}</span></div>
    <p style="color:var(--fg);margin-top:10px">${esc(e.explanation)}</p>
    <div class="sec">Why this boundary exists</div>
    <p class="hint">A dependency only means something once you name what crosses it — this
      route is drawn from resolved call edges in the code graph, not from an import list.</p>
  </div>`;
  insp.querySelector('.iclose').onclick = closeInspector;
}

// SM-JS:END

// ── Inspector: the readable node dossier ──
const insp = document.getElementById('insp');
const KINDS = ['decision','concept','flow','event','endpoint','db','component','gotcha','assumption','todo','fact'];
// project meta (absolute root) for editor deep-links; editor scheme is user-picked
let META = {root:''};
const EDITORS = {vscode:'vscode://file', cursor:'cursor://file', windsurf:'windsurf://file'};
function editorScheme(){ return localStorage.getItem('omni_editor') || 'vscode'; }
function fileLink(file, line){
  if(!META.root||!file) return '';
  const abs = META.root.replace(/\/$/,'')+'/'+file;
  const url = EDITORS[editorScheme()]+'/'+abs+(line?':'+line:'');
  return `<a href="${esc(url)}" title="open in ${editorScheme()}" style="color:var(--accent-2);text-decoration:none">${esc(file)}${line?':'+line:''} ↗</a>`;
}
(async()=>{ try{ META = await api('/api/meta'); }catch(e){} })();
async function post(path, body){
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{})});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return await r.json();
}
function closeInspector(){ insp.classList.remove('open'); insp.innerHTML=''; }

// Editable memory inspector — mem=null means "add new"
function openMemoryInspector(mem){
  const isNew = !mem;
  mem = mem || {id:'', kind:'fact', text:'', files:[], branch:'', evidence:'stated'};
  insp.classList.add('open');
  insp.innerHTML = `
    <div class="ihead">
      <button class="iclose" title="close">×</button>
      <span class="badge k-${esc(mem.kind)}" id="kbadge">${esc(mem.kind)}</span>
      <div class="iname">${isNew?'New memory':'Edit memory'}</div>
      <div class="ipath">${isNew?'added via dashboard':esc(mem.branch)+' · ['+esc(mem.id)+']'}</div>
    </div>
    <div class="ibody">
      ${mem.stale?`<div class="stale-banner">⚠ This memory is <b>STALE</b> — code it was anchored to changed. Re-verify it's still true, then re-anchor.
        <button class="btn" id="mreanchor" style="margin-top:8px">Mark re-verified (re-anchor)</button></div>`:''}
      <div class="sec">Kind</div>
      <select id="mkind">${KINDS.map(k=>`<option ${k===mem.kind?'selected':''}>${k}</option>`).join('')}</select>
      <div class="sec">Evidence — how it was learned</div>
      <select id="mev">${['verified','stated','inferred'].map(e=>`<option ${e===(mem.evidence||'stated')?'selected':''}>${e}</option>`).join('')}</select>
      <div class="hint" style="margin:-8px 0 8px;font-size:11px">✓ verified = confirmed by outcome (trusted, pruned last) · ~ inferred = guessed (pruned first)</div>
      <div class="sec">Text</div>
      <textarea id="mtext" placeholder="One clear sentence of durable project knowledge…">${esc(mem.text)}</textarea>
      <div class="sec">Files (comma-separated, optional)</div>
      <input id="mfiles" value="${esc((mem.files||[]).join(', '))}">
      <div class="irow">
        <button class="btn" id="msave">${isNew?'Add':'Save'}</button>
        ${isNew?'':'<button class="btn danger" id="mdel">Delete</button>'}
        <button class="btn sec" id="mcancel">Cancel</button>
      </div>
      <div id="mmsg" class="hint" style="margin-top:10px"></div>
    </div>`;
  const $=s=>insp.querySelector(s);
  $('.iclose').onclick = $('#mcancel').onclick = closeInspector;
  $('#mkind').onchange = e=>{ const b=$('#kbadge'); b.className='badge k-'+e.target.value; b.textContent=e.target.value; };
  $('#msave').onclick = async ()=>{
    const text=$('#mtext').value.trim(); if(!text){ $('#mmsg').textContent='Text is required.'; return; }
    const files=$('#mfiles').value.split(',').map(s=>s.trim()).filter(Boolean);
    const kind=$('#mkind').value, evidence=$('#mev').value;
    $('#mmsg').textContent='Saving…';
    try{
      if(isNew) await post('/api/memory/add', {text,kind,files,evidence});
      else await post('/api/memory/update', {id:mem.id,text,kind,files,evidence});
      closeInspector(); if(activeTab==='memory') render('memory');
    }catch(e){ $('#mmsg').textContent='Failed: '+e.message; }
  };
  if(!isNew) $('#mdel').onclick = async ()=>{
    if(!confirm('Delete (archive) this memory?')) return;
    try{ await post('/api/memory/delete', {id:mem.id}); closeInspector();
      if(activeTab==='memory') render('memory'); }
    catch(e){ $('#mmsg').textContent='Failed: '+e.message; }
  };
  const ra=$('#mreanchor'); if(ra) ra.onclick = async ()=>{
    try{ await post('/api/memory/reanchor', {id:mem.id}); closeInspector();
      if(activeTab==='memory') render('memory'); }
    catch(e){ $('#mmsg').textContent='Failed: '+e.message; }
  };
}
function kbadge(kind){ return `<span class="badge k-${esc(kind)}">${esc(kind)}</span>`; }
function refRow(c){ return `<div class="ref" data-goto="${esc(c.id)}">${kbadge(c.kind)}
   <span>${esc(c.name)}${c.signature?esc(c.signature):''}</span>
   <span class="mono">${esc((c.file||'').split('/').pop())}${c.line_start?':'+c.line_start:''}</span></div>`; }
function editorPicker(){ const cur=editorScheme();
  return `<select id="edpick" title="editor for open-in-editor links" style="width:auto;padding:2px 6px;margin:0;font-size:10px">`+
    Object.keys(EDITORS).map(k=>`<option ${k===cur?'selected':''}>${k}</option>`).join('')+`</select>`; }
async function openInspector(id){
  insp.classList.add('open');
  insp.innerHTML = '<div class="ibody"><span class="hint">loading…</span></div>';
  let d; try{ d = await api('/api/symbol?id='+encodeURIComponent(id)); }
  catch(e){ insp.innerHTML='<div class="ibody"><span class="hint">'+esc(e.message)+'</span></div>'; return; }
  const sect = (label, items, render, emptyTxt) => items && items.length
    ? `<div class="sec">${label}</div>${items.map(render).join('')}`
    : `<div class="sec">${label}</div><div class="empty">${emptyTxt}</div>`;
  const pills = (label, arr, cls) => arr && arr.length
    ? `<div class="sec">${label}</div><div>${arr.map(x=>`<span class="pill ${cls}">${esc(x)}</span>`).join('')}</div>` : '';
  insp.innerHTML = `
    <div class="ihead">
      <button class="iclose" title="close">×</button>
      ${kbadge(d.kind)}
      <div class="iname">${esc(d.name)}</div>
      <div class="ipath">${fileLink(d.file, d.line_start)||esc(d.file)} ${editorPicker()}</div>
    </div>
    <div class="ibody">
      ${d.signature?`<div class="sig">${esc(d.name)}${esc(d.signature)}</div>`:''}
      <div class="conns">
        <span title="calls downstream">↓ ${(d.calls_out||[]).length} calls</span>
        <span title="called by (upstream)">↑ ${(d.called_by||[]).length} callers</span>
        ${(d.emits||[]).length?`<span title="events/messages published" style="color:#e6cf8a">⚡ ${(d.emits||[]).length} emits</span>`:''}
        ${(d.raises||[]).length?`<span title="exceptions raised" style="color:#f0a5a5">✕ ${(d.raises||[]).length} raises</span>`:''}
        ${(d.contains||[]).length?`<span title="members contained">◇ ${(d.contains||[]).length} members</span>`:''}
      </div>
      ${d.doc?`<div class="sec">What it does</div><div class="doc">${esc(d.doc)}</div>`:''}
      ${pills('Raises', d.raises, 'pill-raise')}
      ${pills('Emits / publishes (events · Kafka · side-effects)', d.emits, 'pill-emit')}
      ${sect('Calls downstream →', d.calls_out, refRow, 'nothing resolved in-repo')}
      ${sect('Called by ←', d.called_by, refRow, 'no in-repo callers')}
      ${d.inherits&&d.inherits.length?sect('Inherits', d.inherits, refRow, ''):''}
      ${d.contains&&d.contains.length?sect('Contains', d.contains, refRow, ''):''}
      ${d.calls&&d.calls.length?`<div class="sec">All calls (incl. external)</div><div>${d.calls.map(x=>`<span class="pill pill-call">${esc(x)}</span>`).join('')}</div>`:''}
      <div class="ifile">${fileLink(d.file, d.line_start)||esc(d.file)}${d.line_end&&d.line_end!==d.line_start?'–'+d.line_end:''}</div>
    </div>`;
  insp.querySelector('.iclose').onclick = closeInspector;
  insp.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>openInspector(el.dataset.goto));
  const ep = insp.querySelector('#edpick');
  if(ep) ep.onchange = e=>{ localStorage.setItem('omni_editor', e.target.value); openInspector(id); };
}

// ── auto-refresh: the server rebuilds on git/file changes; we poll a tiny
//    signature endpoint and re-render the open tab whenever it moves. No manual
//    commands, no page reload. We hold off while the user is typing in a search
//    box so we don't yank the field out from under them.
let lastSig = null;
async function poll(){
  try {
    const s = await api('/api/state');
    if(s.sig && s.sig !== lastSig){
      const typing = document.activeElement && document.activeElement.classList.contains('search');
      if(lastSig !== null && !typing){ render(activeTab); }
      if(!typing) lastSig = s.sig;
    }
    setLive(true);
  } catch(e){ setLive(false); }
}
function setLive(ok){
  let dot = document.getElementById('live');
  if(!dot){ dot = document.createElement('span'); dot.id='live';
    dot.style.cssText='margin-left:auto;font-size:11px;color:#6c6c72;display:flex;align-items:center;gap:5px';
    document.querySelector('nav').appendChild(dot); }
  dot.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:${ok?'#4ade80':'#71717a'};display:inline-block"></span>${ok?'live · auto-updating':'reconnecting…'}`;
}
(async()=>{ render('overview'); poll(); setInterval(poll, 3000); })();
</script>

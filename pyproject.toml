[project]
name = "omni-memory-agent"
version = "0.8.7"
description = "Persistent, branch-aware, git-anchored memory & context layer for coding agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Abhinav Singh" }]
keywords = ["ai", "memory", "coding-agent", "knowledge-graph", "claude-code", "mcp"]
# The memory engine is pure stdlib. tree-sitter powers the multi-language code
# graph + symbol-level staleness; it needs Python >=3.10, so it's pulled in
# automatically there and simply skipped on 3.9 (which falls back to the stdlib
# `ast` graph for Python). Base install therefore works on 3.9+ with no compiler.
dependencies = [
  "tree-sitter>=0.25; python_version >= '3.10'",
  "tree-sitter-language-pack>=1.0; python_version >= '3.10'",
]

[project.optional-dependencies]
graph = ["networkx>=3.0"]          # richer graph analytics (communities, centrality)
serve = ["fastapi>=0.110", "uvicorn>=0.29"]  # optional richer API
dev = ["pytest>=7.0"]

[project.scripts]
omni-memory = "omni_memory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["omni_memory", "omni_memory.graph"]

[tool.setuptools.package-data]
omni_memory = ["static/*.html", "skills/omni-memory/SKILL.md", "skills/omni-memory/**/*"]

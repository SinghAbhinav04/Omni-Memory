<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniMemory</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  /* ── theme: LIGHT by default (like the health-map galaxy), dark on toggle ── */
  :root{
    --bg:#f2e8d5; --panel:#fbf5e9; --panel-2:#eddfc7; --code-bg:#f0e5d0;
    --border:#e4d5b8; --border-2:#d6c29c;
    --fg:#3a2c18; --fg-2:#7c6442; --fg-3:#a48c66;
    --accent:#b5791b; --accent-2:#8a5412; --nav-on:#eeddbd; --shadow:rgba(96,64,18,.16);
    --node-stroke:#fbf5e9; --link:#dcc59a; --link-strong:#b59a6a; --graph-text:#7c6442;
    --node-muted:#e7d8ba; --sel:#8a5412;
    --ui:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  :root[data-theme="dark"]{
    --bg:#1b1509; --panel:#241d0f; --panel-2:#2f2615; --code-bg:#2a2213;
    --border:#3c3018; --border-2:#4d3e22;
    --fg:#eaddc2; --fg-2:#b39a6f; --fg-3:#8a7551;
    --accent:#d9a441; --accent-2:#e8bd57; --nav-on:#2f2615; --shadow:rgba(0,0,0,.55);
    --node-stroke:#1b1509; --link:#3c3018; --link-strong:#5c4a29; --graph-text:#b39a6f;
    --node-muted:#2f2615; --sel:#e8bd57;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13.5px/1.55 var(--ui);
    -webkit-font-smoothing:antialiased}
  #app{display:flex;height:100vh}
  nav{width:194px;flex:none;border-right:1px solid var(--border);padding:16px 0;background:var(--panel)}
  nav h1{font-size:15px;margin:0 18px 16px;letter-spacing:.01em;color:var(--fg);font-weight:650}
  nav a{display:block;padding:8px 18px;color:var(--fg-2);cursor:pointer;border-left:2px solid transparent;font-weight:500}
  nav a:hover{color:var(--fg)}
  nav a.on{color:var(--accent-2);border-left-color:var(--accent);background:var(--nav-on);font-weight:650}
  main{flex:1;overflow:auto;position:relative}
  header{padding:15px 24px;border-bottom:1px solid var(--border);color:var(--fg-2);font-size:12.5px;background:var(--panel)}
  .wrap{padding:20px 24px}
  .hint{color:var(--fg-3)}
  input.search{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border-2);
    color:var(--fg);border-radius:9px;padding:9px 12px;font:inherit;margin-bottom:16px}
  .mem{border:1px solid var(--border);border-radius:11px;padding:12px 14px;margin-bottom:10px;
    background:var(--panel);box-shadow:0 1px 2px var(--shadow)}
  .mem .k{color:var(--fg-3);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
  .mem .t{margin:4px 0 6px;color:var(--fg)}
  .mem .f{color:var(--fg-2);font-size:11px;font-family:var(--mono)}
  .chip{display:inline-block;border:1px solid var(--border-2);border-radius:9px;padding:1px 8px;
    margin-right:6px;color:var(--fg-2);font-size:10px;font-family:var(--mono)}
  svg{width:100%;height:calc(100vh - 54px);display:block}
  text{font:10px var(--mono);fill:var(--graph-text)}

  /* Everything between the SM-CSS sentinels is lifted verbatim into the standalone
     artifact by `omni-memory systemmap`. Keep the sentinels on their own lines — the
     extractor slices between them, so text sharing a line with one lands in the output. */
  /* SM-CSS:START */
  /* ── System Map: isometric city, hand-rolled SVG (no d3 — works offline) ── */
  #sm{height:calc(100vh - 190px);touch-action:none;background:transparent}
  #sm [data-node]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .smbar{display:flex;align-items:center;gap:9px;padding:10px 24px;flex-wrap:wrap;
    border-bottom:1px solid var(--border);background:var(--panel)}
  .smsnap{font-family:var(--mono);font-size:11px;color:var(--fg-2)}
  .smsel{background:var(--panel-2);border:1px solid var(--border-2);color:var(--fg);
    border-radius:7px;padding:5px 9px;font:inherit;font-size:12px;max-width:320px}
  .smbtn{background:var(--panel-2);border:1px solid var(--border-2);color:var(--fg);
    border-radius:7px;padding:5px 11px;font:inherit;font-size:12px;cursor:pointer}
  .smbtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent-2)}
  .smbtn:disabled{opacity:.42;cursor:default}
  .smlegend{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 24px;
    border-bottom:1px solid var(--border);font-size:11px;color:var(--fg-2)}
  .smtog{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid transparent;
    border-radius:7px;padding:3px 8px;color:var(--fg-2);font:inherit;font-size:11px;cursor:pointer}
  .smtog:hover{border-color:var(--border-2)}
  .smtog.off{opacity:.4;text-decoration:line-through}
  .smsw{width:22px;border-top-width:2.5px;display:inline-block}
  .smsep{width:1px;height:15px;background:var(--border-2);margin:0 4px}
  .smkey{display:inline-flex;align-items:center;gap:5px;cursor:help}
  .smdot{width:9px;height:9px;border-radius:2px;display:inline-block}
  .smstep{padding:10px 24px;border-top:1px solid var(--border);background:var(--panel);
    font-size:12px;color:var(--fg-2);font-family:var(--mono);min-height:38px}
  .smrow{padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;color:var(--fg-2)}
  .smrow:last-child{border-bottom:none}
  @media (max-width:900px){ #sm{height:52vh} .smbar,.smlegend,.smstep{padding-left:14px;padding-right:14px} }
  /* The map is static unless a flow is stepped, so there is no looping motion to stop;
     this keeps any transition we add later honest under a reduced-motion preference. */
  @media (prefers-reduced-motion:reduce){ #sm *{transition:none!important;animation:none!important} }
  /* SM-CSS:END */
  .brow{border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-bottom:8px;
    background:var(--panel);display:flex;justify-content:space-between;gap:12px;box-shadow:0 1px 2px var(--shadow)}
  .brow b{color:var(--fg)}
  .merged{color:var(--fg-2)}
  .md{max-width:900px;color:var(--fg)}
  .md h1,.md h2,.md h3{color:var(--fg);border-bottom:1px solid var(--border);padding-bottom:4px;margin-top:24px}
  .md table{border-collapse:collapse;width:100%;margin:12px 0;font-size:12px}
  .md th,.md td{border:1px solid var(--border-2);padding:6px 8px;text-align:left;vertical-align:top}
  .md th{background:var(--panel-2);color:var(--fg)}
  .md code{background:var(--code-bg);border:1px solid var(--border-2);border-radius:4px;padding:1px 5px;font-size:12px;font-family:var(--mono)}
  .md pre{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:12px;overflow:auto}
  .md pre code{border:none;background:none}
  .md a{color:var(--accent-2)}.md svg{max-width:100%;background:var(--panel);border:1px solid var(--border);border-radius:8px}

  /* ── kind color system (shared by memory cards + graph nodes) ── */
  .badge{display:inline-block;padding:1px 7px;border-radius:6px;font-size:9px;
    text-transform:uppercase;letter-spacing:.07em;font-weight:700;vertical-align:middle;
    background:color-mix(in srgb, var(--kc,#9a865a) 17%, var(--panel));
    color:color-mix(in srgb, var(--kc,#9a865a) 80%, var(--fg));
    border:1px solid color-mix(in srgb, var(--kc,#9a865a) 34%, var(--panel))}
  .k-decision{--kc:#c9902e}.k-gotcha{--kc:#c1522f}
  .k-flow{--kc:#b8791f}.k-fact{--kc:#9c7b3f}
  .k-endpoint{--kc:#8a7d2b}.k-todo{--kc:#cc9a1f}
  .k-class{--kc:#a86a3c}.k-function{--kc:#96852f}
  .k-method{--kc:#b07a2e}.k-file{--kc:#a3927a}
  .k-user{--kc:#c1522f}.k-feedback{--kc:#b5622e}
  .k-assumption,.k-concept,.k-component,.k-event,.k-db{--kc:#9a865a}

  /* ── inspector: slide-in node dossier ── */
  #insp{position:fixed;top:0;right:0;width:390px;max-width:92vw;height:100vh;
    background:var(--panel);border-left:1px solid var(--border);box-shadow:-18px 0 44px var(--shadow);
    transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);
    z-index:40;overflow-y:auto;padding:0}
  #insp.open{transform:translateX(0)}
  #insp .ihead{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--border);
    padding:16px 18px 12px;z-index:1}
  #insp .iclose{position:absolute;top:12px;right:14px;color:var(--fg-2);cursor:pointer;
    font-size:18px;line-height:1;border:none;background:none}
  #insp .iname{font-size:15px;color:var(--fg);font-weight:650;word-break:break-word;margin:6px 0 2px}
  #insp .ipath{font-size:11px;color:var(--fg-3);word-break:break-all;font-family:var(--mono)}
  #insp .ibody{padding:14px 18px 40px}
  #insp .sig{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;
    margin:2px 0 14px;color:var(--accent-2);font-size:12px;font-family:var(--mono);white-space:pre-wrap;word-break:break-word}
  #insp .sec{margin:16px 0 6px;color:var(--fg-2);font-size:10px;text-transform:uppercase;letter-spacing:.09em}
  #insp .doc{color:var(--fg);font-size:12.5px;line-height:1.55;border-left:2px solid var(--border-2);padding-left:10px}
  #insp .ref{display:flex;align-items:center;gap:8px;padding:6px 9px;margin:4px 0;border-radius:7px;
    background:var(--panel-2);border:1px solid var(--border);cursor:pointer;font-size:12px;color:var(--fg)}
  #insp .ref:hover{border-color:var(--border-2)}
  #insp .ref .mono{color:var(--fg-2);font-size:10px;margin-left:auto;font-family:var(--mono)}
  .pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;margin:0 6px 6px 0;
    background:color-mix(in srgb,var(--pc,#889) 15%,var(--panel));color:color-mix(in srgb,var(--pc,#889) 75%,var(--fg));
    border:1px solid color-mix(in srgb,var(--pc,#889) 30%,var(--panel))}
  .pill-raise{--pc:#c1522f}
  .pill-emit{--pc:#cc9a1f}
  .pill-call{--pc:#b07a2e}
  .empty{color:var(--fg-3);font-size:12px;font-style:italic}
  #insp .conns{display:flex;flex-wrap:wrap;gap:6px 12px;margin:2px 0 4px;font-size:11px;color:var(--fg-2)}
  #insp .conns span{white-space:nowrap}
  #insp .ifile{margin-top:22px;padding-top:10px;border-top:1px solid var(--border);text-align:right;
    font-family:var(--mono);font-size:10.5px;color:var(--fg-2);word-break:break-all}
  #insp .ifile a{color:var(--accent-2);text-decoration:none}
  nav a#flushbtn{color:#c2554a;margin-top:8px}nav a#flushbtn:hover{color:#e0574f}
  nav a#themebtn{color:var(--fg-2);margin-top:2px}nav a#themebtn:hover{color:var(--fg)}
  #gsearch{width:calc(100% - 24px);margin:0 12px 12px;background:var(--panel-2);border:1px solid var(--border-2);
    color:var(--fg);border-radius:9px;padding:7px 10px;font:11px/1.4 var(--ui)}
  #gsearch:focus{outline:none;border-color:var(--accent)}
  .sres{border:1px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:7px;background:var(--panel);cursor:pointer}
  .sres:hover{border-color:var(--border-2);box-shadow:0 1px 3px var(--shadow)}
  .sres .sr-h{display:flex;align-items:center;gap:8px;margin-bottom:3px}
  .sres .sr-mono{color:var(--fg-2);font-size:10px;margin-left:auto;font-family:var(--mono)}
  .stat{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .stat .s{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:10px 16px;min-width:82px;box-shadow:0 1px 2px var(--shadow)}
  .stat .s b{display:block;font-size:21px;color:var(--fg);font-weight:650}.stat .s span{font-size:10px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.06em}
  /* ── Integrity: the trust story, which until now only existed in a terminal ── */
  .chk{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--border);
    border-radius:11px;padding:11px 14px;margin-bottom:9px;background:var(--panel);
    box-shadow:0 1px 2px var(--shadow)}
  .chk .dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px}
  .chk .dot.ok{background:#4f8f60}.chk .dot.warn{background:#b5791b}
  .chk .dot.bad{background:#c1522f}.chk .dot.na{background:var(--border-2)}
  .chk h4{margin:0 0 2px;font-size:12.5px;font-weight:650;color:var(--fg)}
  .chk p{margin:0;color:var(--fg-2);font-size:12px}
  .chk .fix{margin-top:5px;color:var(--fg-3);font-size:11px;font-family:var(--mono)}
  .bar{height:7px;border-radius:4px;background:var(--panel-2);overflow:hidden;margin:5px 0 2px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .cliff{border:1px solid var(--border);border-radius:11px;padding:13px 15px;
    margin-bottom:11px;background:var(--panel);box-shadow:0 1px 2px var(--shadow)}
  .cliff .why{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--panel-2);
    color:var(--fg-2);font-size:11.5px;border-left:2px solid var(--accent)}
  .cliff svg{width:100%;height:120px}
  .btn{background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:8px;
    padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn:hover{filter:brightness(1.06)}
  .btn.sec{background:var(--panel-2);border-color:var(--border-2);color:var(--fg)}.btn.sec:hover{filter:brightness(.98)}
  .btn.danger{background:#c1522f;border-color:#c1522f;color:#fff}.btn.danger:hover{filter:brightness(1.05)}
  nav a#flushbtn{color:#c1522f}
  #insp textarea,#insp select,#insp input{width:100%;background:var(--panel-2);border:1px solid var(--border-2);
    color:var(--fg);border-radius:8px;padding:9px 11px;font:inherit;margin:4px 0 12px}
  #insp textarea{min-height:110px;resize:vertical;line-height:1.5}
  .irow{display:flex;gap:8px;margin-top:6px}
  .doc-edit{width:100%;min-height:60vh;background:var(--panel-2);border:1px solid var(--border-2);color:var(--fg);
    border-radius:8px;padding:12px;font:12px/1.6 var(--mono);resize:vertical}
  .stale-banner{background:color-mix(in srgb,#ca8a04 14%,var(--panel));border:1px solid color-mix(in srgb,#ca8a04 34%,var(--panel));
    color:color-mix(in srgb,#ca8a04 72%,var(--fg));border-radius:8px;
    padding:10px 12px;margin-bottom:14px;font-size:12px;line-height:1.5}
</style></head>
<body>
<div id="app">
  <nav>
    <h1>◇ OmniMemory</h1>
    <input id="gsearch" placeholder="Search everything…" autocomplete="off">
    <a data-tab="overview" class="on">Overview</a>
    <a data-tab="integrity">Integrity</a>
    <a data-tab="memory">Memory</a>
    <a data-tab="docs">Docs</a>
    <a data-tab="graph">Memory Graph</a>
    <a data-tab="code">Code Graph</a>
    <a data-tab="health">Health Map</a>
    <a data-tab="system">System Map</a>
    <a data-tab="conflicts">Conflicts</a>
    <a data-tab="branches">Repo Graph</a>
    <a id="flushbtn" title="Wipe stored memory/graph so it can be rebuilt from scratch">Flush</a>
    <a id="themebtn" title="Toggle light / dark">◐ Theme</a>
  </nav>
  <main>
    <header id="hdr">loading…</header>
    <div class="wrap" id="view"></div>
  </main>
  <aside id="insp"></aside>
</div>
<script>
const view = document.getElementById('view'), hdr = document.getElementById('hdr');
async function api(p){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), 20000);
  try {
    const r = await fetch(p, {signal:c.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
function esc(s){ return (''+s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

let activeTab = 'overview';
// ── theme: light by default, dark on toggle, persisted ──
(function(){ const t = localStorage.getItem('omni-theme') || 'light';
  document.documentElement.setAttribute('data-theme', t); })();
function isDark(){ return document.documentElement.getAttribute('data-theme')==='dark'; }
// graph colours resolved per theme (SVG attrs can't read CSS vars, so re-render on toggle)
function TC(){ return isDark()
  ? {stroke:'#1b1509', link:'#3c3018', linkStrong:'#5c4a29', text:'#b39a6f', muted:'#2f2615', sel:'#e8bd57', label:'#6a5836'}
  : {stroke:'#fbf5e9', link:'#dcc59a', linkStrong:'#b59a6a', text:'#7c6442', muted:'#e7d8ba', sel:'#8a5412', label:'#b59a6a'}; }
document.getElementById('themebtn').onclick=()=>{
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('omni-theme', next);
  mermaidInit = false;                       // re-init mermaid for the new theme
  render(activeTab);
};
document.querySelectorAll('nav a[data-tab]').forEach(a=>a.onclick=()=>{
  const gs=document.getElementById('gsearch'); if(gs) gs.value='';
  document.querySelectorAll('nav a').forEach(x=>x.classList.remove('on'));
  a.classList.add('on'); activeTab = a.dataset.tab; render(activeTab);
});

// ── global search: memories + code symbols, click-through to the inspector ──
let searchTimer=null;
const gsearch = document.getElementById('gsearch');
gsearch.oninput = ()=>{ clearTimeout(searchTimer); const q=gsearch.value.trim();
  searchTimer=setTimeout(()=>{ if(q) renderSearch(q); else render(activeTab); }, 180); };
async function renderSearch(q){
  hdr.textContent = 'search: '+q;
  document.querySelectorAll('nav a').forEach(x=>x.classList.remove('on'));
  let r; try{ r = await api('/api/search?q='+encodeURIComponent(q)); }
  catch(e){ view.innerHTML='<span class="hint">search failed: '+esc(e.message)+'</span>'; return; }
  const mm=r.memories||[], ss=r.symbols||[];
  if(!mm.length && !ss.length){ view.innerHTML='<span class="hint">no matches for “'+esc(q)+'”.</span>'; return; }
  const memHtml = mm.map(m=>`<div class="sres" data-mem="${esc(m.id)}">
      <div class="sr-h">${m.kind?`<span class="badge k-${esc(m.kind)}">${esc(m.kind)}</span>`:''}
        <span class="sr-mono">memory · [${esc(m.id)}]</span></div>
      <div style="color:var(--fg)">${esc(m.text)}</div></div>`).join('');
  const symHtml = ss.map(s=>`<div class="sres" data-sym="${esc(s.id)}">
      <div class="sr-h"><span class="badge k-${esc(s.kind)}">${esc(s.kind)}</span>
        <span style="color:var(--fg)">${esc(s.name)}${s.signature?esc(s.signature):''}</span>
        <span class="sr-mono">${esc((s.file||'').split('/').pop())}${s.line_start?':'+s.line_start:''}</span></div>
      ${s.doc?`<div style="color:#9a9aa0;font-size:11.5px">${esc(s.doc)}</div>`:''}</div>`).join('');
  view.innerHTML =
    (mm.length?`<div class="sec" style="color:#7c7c82;margin:2px 0 8px">Memories (${mm.length})</div>${memHtml}`:'')+
    (ss.length?`<div class="sec" style="color:#7c7c82;margin:16px 0 8px">Code symbols (${ss.length})</div>${symHtml}`:'');
  const byId={}; mm.forEach(m=>byId[m.id]=m);
  view.querySelectorAll('[data-mem]').forEach(el=>el.onclick=()=>openMemoryInspector(byId[el.dataset.mem]));
  view.querySelectorAll('[data-sym]').forEach(el=>el.onclick=()=>openInspector(el.dataset.sym));
}

document.getElementById('flushbtn').onclick = async ()=>{
  const scope = prompt('Flush what? Type: all · memory · graph\n(This wipes stored data so it can be rebuilt — cannot be undone.)', 'all');
  if(!scope) return;
  if(!['all','memory','graph'].includes(scope.trim())){ alert('Enter one of: all, memory, graph'); return; }
  if(!confirm('Flush "'+scope.trim()+'" for this project? This cannot be undone.')) return;
  try {
    const r = await fetch('/api/flush?scope='+encodeURIComponent(scope.trim()), {method:'POST'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    const total = Object.values(d.flushed||{}).reduce((a,b)=>a+b,0);
    alert('Flushed '+total+' rows. Rebuild with omni-memory build / map.');
    render(activeTab);
  } catch(e){ alert('Flush failed: '+e.message); }
};

async function render(tab){
  view.innerHTML = '<span class="hint">loading…</span>';
  try {
    closeInspector();
    if(tab==='overview') return await renderOverview();
    if(tab==='integrity') return await renderIntegrity();
    if(tab==='memory') return await renderMemory();
    if(tab==='docs') return await renderDocs();
    if(tab==='graph') return await renderGraph();
    if(tab==='code') return await renderCode();
    if(tab==='health') return await renderHealth();
    if(tab==='system') return await renderSystem();
    if(tab==='conflicts') return await renderConflicts();
    if(tab==='branches') return await renderBranches();
  } catch(e){
    view.innerHTML = '<span class="hint">render error in <b>'+esc(tab)+'</b>: '+esc(e.message)+
      '<br>(open the browser console for the stack trace)</span>';
    console.error(e);
  }
}

// Compact token counts, mirroring savings.human() so the dashboard and the CLI never
// disagree about the same number.
function smTok(n){
  if(n >= 1e6) return (n/1e6).toFixed(1)+'M';
  if(n >= 1e3) return (n/1e3).toFixed(1)+'k';
  return ''+(n||0);
}

// ── Integrity ───────────────────────────────────────────────────────────────
// Everything `doctor` measures, rendered. Two rules the CLI already follows and the
// panel must not break: a coverage figure is never shown without its denominator, and a
// check that could not run says so instead of rendering green.

function chk(state, title, body, fix){
  const cls = state===true?'ok':state===false?'bad':state===null?'na':'warn';
  return `<div class="chk"><span class="dot ${cls}"></span><div style="flex:1;min-width:0">
    <h4>${esc(title)}</h4><p>${body}</p>
    ${fix?`<div class="fix">→ ${esc(fix)}</div>`:''}</div></div>`;
}
function pctBar(n, d, label){
  const p = d ? Math.round(n/d*100) : 0;
  // The denominator rides along with the percentage, always. `0%` over a denominator of
  // four is a different fact from `0%` over four hundred, and a bare bar hides which.
  return `<div style="margin:7px 0 3px"><div style="display:flex;font-size:11px;color:var(--fg-2)">
      <span>${esc(label)}</span><b style="margin-left:auto">${p}% <span class="hint">(${n}/${d})</span></b></div>
    <div class="bar"><i style="width:${p}%"></i></div></div>`;
}

/** Loss curve: keys destroyed at each fold length, with the cliff marked.
 *  Hand-rolled SVG rather than d3, so it renders with the CDN blocked — and because it
 *  is the point the thread kept making: on a variable-length population the cliff is one
 *  point on this curve, and the shape to its left is what a single number throws away. */
function lossCurve(curve, cliff){
  if(!curve || curve.length < 2) return '';
  const W=520, H=120, PL=34, PR=10, PT=10, PB=20;
  const maxL = curve[curve.length-1].length, maxLost = Math.max(1, ...curve.map(p=>p.keys_lost));
  const X = L => PL + (L/maxL)*(W-PL-PR), Y = v => H-PB - (v/maxLost)*(H-PT-PB);
  const pts = curve.map(p=>`${X(p.length).toFixed(1)},${Y(p.keys_lost).toFixed(1)}`).join(' ');
  const area = `${PL},${H-PB} ${pts} ${X(maxL).toFixed(1)},${H-PB}`;
  const mark = cliff ? `<line x1="${X(cliff).toFixed(1)}" y1="${PT}" x2="${X(cliff).toFixed(1)}"
      y2="${H-PB}" stroke="#c1522f" stroke-width="1.2" stroke-dasharray="3 3"></line>
    <text x="${(X(cliff)+4).toFixed(1)}" y="${PT+9}" style="fill:#c1522f">cliff ${cliff}</text>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
      aria-label="keys lost at each fold length">
    <polygon points="${area}" fill="var(--accent)" opacity=".16"></polygon>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.6"></polyline>
    ${mark}
    <line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="var(--border-2)"></line>
    <text x="2" y="${PT+8}">${maxLost}</text><text x="2" y="${H-PB}">0</text>
    <text x="${PL}" y="${H-6}">1 char</text>
    <text x="${W-PR}" y="${H-6}" text-anchor="end">${maxL} chars</text></svg>
  <div class="hint" style="font-size:11px">keys destroyed by truncating every key to N characters</div>`;
}

async function renderIntegrity(){
  hdr.textContent = 'integrity · every number here is re-measured on load';
  const d = await api('/api/integrity');
  const P = d.provenance||{}, C = d.collector||{}, I = d.identifier||{};
  let html = '<div class="sec" style="color:#7c7c82;margin:2px 0 9px">Can the memory be re-checked against the code?</div>';

  if(P.error){ html += chk(null,'source integrity','could not be measured: '+esc(P.error)); }
  else {
    const clean = !(P.orphaned || P.uncheckable);
    html += chk(clean?true:false, 'source integrity',
      `${P.fresh||0} fresh · ${P.drifted||0} drifted · ${P.orphaned||0} orphaned · `
      + `${P.uncheckable||0} unverifiable, of ${P.anchored||0} bindable memories`
      + (P.not_bindable ? `<br><span class="hint">${P.not_bindable} not-bindable (no addressable source) — counted beside the denominator, never inside it</span>`:'')
      + pctBar(Math.round((P.refetch_coverage||0)*(P.anchored||0)), P.anchored||0, 'verified re-fetchable')
      + pctBar(Math.round((P.locator_coverage||0)*(P.anchored||0)), P.anchored||0, 'carry a content key'),
      clean?'':'omni-memory gc  ·  re-capture legacy memory to add content keys');
    const obs = P.observation_binding_coverage||0;
    html += chk(P.unbound?false:(obs>0?true:'warn'), 'observation binding',
      `${Math.round(obs*100)}% bound to bytes the agent actually READ; the rest are `
      + `capture-time declarations — a weaker claim, kept apart on purpose`
      + (P.unbound?`<br><b>⚠ ${P.unbound} UNBOUND_CAPTURE</b> — the source moved before capture`:''),
      obs>0?'':'omni-memory bind — installs the read hook');
  }

  html += '<div class="sec" style="color:#7c7c82;margin:20px 0 9px">Did the instrument actually run?</div>';
  if(C.error) html += chk(null,'collector liveness','could not be measured: '+esc(C.error));
  else html += chk({OK:true,FAIL:false,SKIP:null}[C.verdict],
    'collector ran (external witness)',
    `<b>${esc(C.verdict||'?')}</b> — ${esc(C.why||'')}`
    + `<br><span class="hint">checked against the runtime's own transcript, not against the `
    + `ledger — a hook that never ran leaves an empty ledger that looks exactly like a quiet session</span>`,
    C.verdict==='FAIL' ? C.remedy : '');

  html += '<div class="sec" style="color:#7c7c82;margin:20px 0 9px">Identifier contract</div>';
  if(I.error) html += chk(null,'identifier contract','could not be measured: '+esc(I.error));
  else {
    html += chk(!I.off_form_count, 'declared form',
      `${I.keys} ids · <code>${esc(I.declared||'')}</code>`
      + (I.off_form_count?`<br><b>⚠ ${I.off_form_count} off-form</b>: ${esc((I.off_form||[]).slice(0,4).join(', '))}`
                        :'<br><span class="hint">all on form</span>'),
      I.off_form_count?'off-form ids arrive via an imported team shard from another version':'');
    html += chk(I.verdict==='COST_MEASURED'?false:null,
      'fold cost — reported three-valued, never as a bare zero',
      `<b>${esc((I.verdict||'').replace(/_/g,' ').toLowerCase())}</b> — ${esc(I.why||'')}`);

    html += '<div class="sec" style="color:#7c7c82;margin:20px 0 9px">Key cliff — a property of the keys, not an estimate</div>';
    (I.populations||[]).forEach(p=>{
      const span = p.fixed_length ? `${p.key_length_max} chars, fixed`
                                  : `${p.key_length_min}..${p.key_length_max} chars, variable`;
      const dist = p.distance_to_cliff!==null && p.distance_to_cliff!==undefined
        ? `<b>${p.distance_to_cliff}</b> chars of slack at the fold (${p.fold})`
        : `distance <b>undefined</b> — ${esc(p.distance_why_not||'')}`;
      // Silence has causes and they mean opposite things, so the panel says which one.
      const reason = {
        threshold_unreachable_at_fold:
          `The at-scale verdict is <b>unreachable</b> on this shape of key: the threshold at
           the first clean fold is ${p.threshold_at_first_clean_fold?Number(p.threshold_at_first_clean_fold).toExponential(2):'—'}
           against ${p.keys} keys. A cliff warning gated on that verdict would be dead code
           here — not quiet, unsatisfiable.`,
        positions_saturated:
          `The space estimate is the sample size in disguise (too few keys), so
           &ldquo;safe at scale&rdquo; would be unearned.`,
        no_fold_merges_these_keys:
          `Nothing collides at any length — this one is genuinely clear.`
      }[p.reason_empty];
      html += `<div class="cliff">
        <div style="display:flex;align-items:baseline;gap:9px;flex-wrap:wrap">
          <b style="font-family:var(--mono);font-size:13px">${esc(p.population)}</b>
          <span class="chip">${p.keys} keys</span><span class="chip">${esc(span)}</span>
          <span class="chip">${p.fold?('folded at '+p.fold):'never folded'}</span></div>
        <p style="margin:7px 0 0;color:var(--fg-2)">
          ${p.collides_at_length!==null
            ? `Merges at <b>≤${p.collides_at_length}</b> characters, clean from ${p.first_clean_fold}. ${dist}.`
            : 'No truncation merges these keys.'}
          ${p.keys_shorter_than_cliff
            ? `<br><span class="hint">${p.keys_shorter_than_cliff} of ${p.keys} keys are shorter than the cliff —
               for them the fold is the identity, so this number describes the population's
               right edge and not its shape.</span>` : ''}</p>
        ${reason?`<div class="why">${reason}</div>`:''}
        ${lossCurve(p.loss_curve, p.collides_at_length)}</div>`;
    });
  }
  view.innerHTML = html;
}

name: Publish to PyPI

# Publishes the package whenever you push a version tag (e.g. `v0.1.0`).
# Uses PyPI Trusted Publishing (OIDC) — no API token or secret to store.
# One-time setup on PyPI: create the "trusted publisher" for project
# `omni-memory-agent` pointing at
#   owner=SinghAbhinav04  repo=Omni-Memory  workflow=publish.yml  environment=pypi
# (https://docs.pypi.org/trusted-publishers/)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

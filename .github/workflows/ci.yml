name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 exercises the stdlib `ast` fallback (tree-sitter marker skips it);
        # 3.10+ pulls tree-sitter, so the matrix covers both code-graph backends.
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Show backend
        run: python -c "import omni_memory.graph.extract as e; print('tree-sitter:', e.available())"
      - name: Run tests
        run: python -m pytest -q
